# ============================================================
# Scalable AI Production Infrastructure — Docker Compose
# Production-grade orchestration with fault-tolerance
# ============================================================
# Usage:
#   cp docker/.env.example .env   # Configure secrets
#   docker compose -f docker/compose.yaml up -d
# ============================================================

services:
  # ────────────────────────────────────────────
  # API Gateway — Nginx Reverse Proxy
  # ────────────────────────────────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: sai-gateway
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      api-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ────────────────────────────────────────────
  # API Service — Core REST API
  # ────────────────────────────────────────────
  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        shared: ../shared
    container_name: sai-api
    env_file: .env
    environment:
      - SERVICE_NAME=api-service
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - MONGO_URL=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=${MONGO_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
    expose:
      - "${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ────────────────────────────────────────────
  # Auth Service — Authentication & Authorization
  # ────────────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        shared: ../shared
    container_name: sai-auth
    env_file: .env
    environment:
      - SERVICE_NAME=auth-service
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
    expose:
      - "${AUTH_PORT:-8001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ────────────────────────────────────────────
  # Worker Service — Celery Async Task Workers
  # ────────────────────────────────────────────
  worker-service:
    build:
      context: ../services/worker-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        shared: ../shared
    container_name: sai-worker
    env_file: .env
    environment:
      - SERVICE_NAME=worker-service
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - MONGO_URL=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=${MONGO_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/2
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ────────────────────────────────────────────
  # Flower — Celery Monitoring Dashboard
  # ────────────────────────────────────────────
  flower:
    build:
      context: ../services/worker-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        shared: ../shared
    container_name: sai-flower
    command: celery -A app.worker flower --port=5555
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/2
    ports:
      - "5555:5555"
    depends_on:
      worker-service:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ────────────────────────────────────────────
  # Inference Service — Model Serving
  # ────────────────────────────────────────────
  inference-service:
    build:
      context: ../services/inference-service
      dockerfile: Dockerfile
      target: production
      additional_contexts:
        shared: ../shared
    container_name: sai-inference
    env_file: .env
    environment:
      - SERVICE_NAME=inference-service
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      - DEVICE=${INFERENCE_DEVICE:-cpu}
      - MAX_BATCH_SIZE=${INFERENCE_MAX_BATCH_SIZE:-32}
      - MODEL_PATH=${INFERENCE_MODEL_PATH:-/app/models}
    expose:
      - "${INFERENCE_PORT:-8002}"
    volumes:
      - model-data:/app/models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INFERENCE_PORT:-8002}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ────────────────────────────────────────────
  # PostgreSQL 17 — Relational Data Store
  # ────────────────────────────────────────────
  postgres:
    image: postgres:17.5-alpine
    container_name: sai-postgres
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    command: >
      postgres
        -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
        -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
        -c effective_cache_size=512MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c log_statement=mod
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────
  # MongoDB 7 — Document Store
  # ────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: sai-mongo
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/init-mongo.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    command: ["mongod", "--auth", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────
  # Redis 7 — Cache, Broker & Sessions
  # ────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: sai-redis
    env_file: .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${REDIS_MAX_MEMORY:-512m}
        reservations:
          cpus: "0.1"
          memory: 64M
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory ${REDIS_MAX_MEMORY:-512mb}
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
        --save 300 100
        --tcp-backlog 511
        --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ────────────────────────────────────────────
# Networks — Traffic Isolation
# ────────────────────────────────────────────
networks:
  frontend:
    name: sai-frontend
    driver: bridge
  backend:
    name: sai-backend
    driver: bridge
  data:
    name: sai-data
    driver: bridge
    internal: true  # No external access to data network

# ────────────────────────────────────────────
# Volumes — Persistent Storage
# ────────────────────────────────────────────
volumes:
  postgres-data:
    name: sai-postgres-data
  mongo-data:
    name: sai-mongo-data
  redis-data:
    name: sai-redis-data
  model-data:
    name: sai-model-data
