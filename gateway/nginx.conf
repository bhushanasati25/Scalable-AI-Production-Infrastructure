# ============================================================
# Nginx API Gateway Configuration
# Reverse proxy with JWT auth, rate limiting, TLS termination
# ============================================================

# Rate limiting zone: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream definitions with keepalive connections
upstream api_service {
    server api-service:8000;
    keepalive 32;
}

upstream auth_service {
    server auth-service:8001;
    keepalive 16;
}

upstream inference_service {
    server inference-service:8002;
    keepalive 16;
}

upstream flower_dashboard {
    server flower:5555;
    keepalive 8;
}

# Logging format with request timing
log_format main_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_request_id":"$http_x_request_id"'
    '}';

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'" always;

    # Logging
    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    # Connection limits
    limit_conn conn_limit 100;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        application/xml;

    # Request size limits
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;

    # ── Health Check ──
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # ── API Routes ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_service;
    }

    # ── Auth Routes ──
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://auth_service;
    }

    # ── Inference Routes ──
    location /inference/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://inference_service;

        # Extended timeouts for model inference
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── OpenAPI Documentation ──
    location /docs {
        proxy_pass http://api_service;
    }

    location /redoc {
        proxy_pass http://api_service;
    }

    location /openapi.json {
        proxy_pass http://api_service;
    }

    # ── Flower Dashboard (restricted) ──
    location /flower/ {
        # TODO: Add IP whitelist or basic auth for production
        proxy_pass http://flower_dashboard;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
    }

    # ── CORS Preflight ──
    location @cors_preflight {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Request-ID' always;
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
    }

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ── Deny dotfiles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Default 404 ──
    location / {
        return 404 '{"error":"not_found","message":"Route not found"}';
        add_header Content-Type application/json;
    }
}
