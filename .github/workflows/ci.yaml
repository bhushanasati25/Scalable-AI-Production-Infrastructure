# CI Pipeline — Build, Lint, Test on every PR and push to main
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type Check ──
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, auth-service, worker-service, inference-service]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          uv pip install --system ".[dev]"

      - name: Ruff lint
        run: |
          cd services/${{ matrix.service }}
          ruff check .

      - name: Ruff format check
        run: |
          cd services/${{ matrix.service }}
          ruff format --check .

      - name: Mypy type check
        run: |
          cd services/${{ matrix.service }}
          mypy app || true  # Non-blocking for now
        continue-on-error: true

  # ── Unit Tests ──
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api-service, auth-service, worker-service, inference-service]
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test_user
          MONGO_INITDB_ROOT_PASSWORD: test_password
        ports:
          - 27017:27017
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      MONGO_URL: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          uv pip install --system ".[dev]"

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          pytest -v --tb=short --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/

  # ── Integration Tests ──
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          docker compose -f docker/compose.test.yaml up --build \
            --abort-on-container-exit \
            --exit-code-from api-service-test

      - name: Collect test reports
        if: always()
        run: |
          docker compose -f docker/compose.test.yaml cp api-service-test:/app/reports ./reports || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker/compose.test.yaml down -v

  # ── Security Scan ──
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api-service, auth-service, worker-service, inference-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ${{ matrix.service }}:scan \
            --target production \
            services/${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

  # ── Build Docker Images ──
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-service, auth-service, worker-service, inference-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Pipeline Summary ──
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, security-scan]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          echo "Pipeline completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-test.result }}"
          echo "Integration Tests: ${{ needs.integration-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
