[project]
name = "worker-service"
version = "0.1.0"
description = "Celery Async Task Workers"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4,<6.0",
    "flower>=2.0,<3.0",
    "redis>=5.2,<6.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.28,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "motor>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
