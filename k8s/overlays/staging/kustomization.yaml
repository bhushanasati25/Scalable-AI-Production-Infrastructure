apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scalable-ai-staging

resources:
  - ../../base

patches:
  # API Service — 2 replicas, INFO logging
  - target:
      kind: Deployment
      name: api-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: INFO

  # Worker — 2 replicas
  - target:
      kind: Deployment
      name: worker-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # Inference — 2 replicas
  - target:
      kind: Deployment
      name: inference-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

labels:
  - pairs:
      env: staging

