# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - alerts.yml

scrape_configs:
  # ── API Service ──
  - job_name: api-service
    metrics_path: /metrics
    static_configs:
      - targets: ['api-service:8000']
        labels:
          service: api-service

  # ── Auth Service ──
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8001']
        labels:
          service: auth-service

  # ── Inference Service ──
  - job_name: inference-service
    metrics_path: /metrics
    static_configs:
      - targets: ['inference-service:8002']
        labels:
          service: inference-service

  # ── Redis ──
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # ── PostgreSQL ──
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  # ── Prometheus self-monitoring ──
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
