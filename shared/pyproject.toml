[project]
name = "shared-common"
version = "0.1.0"
description = "Shared library for Scalable AI Production Infrastructure"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
